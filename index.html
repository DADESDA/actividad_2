<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedido de Comida</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>

  <!-- HEADER - Líder -->
  <header>
    <nav>
      <div class="logo">🍽️ FoodOrder</div>
      <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#menu">Menú</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- BODY - Colaborador 1 -->
  <main id="inicio">
    <section class="hero">
      <h1>¿Qué vas a pedir hoy?</h1>
      <p>Completa el formulario y recibe tu pedido a domicilio.</p>
    </section>

    <section id="menu" class="formulario-section">
      <h2>Hacer un pedido</h2>
      <form id="formPedido">

        <label for="nombre">Tu nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: María García" required />

        <label for="comida">¿Qué deseas pedir?</label>
        <select id="comida" name="comida">
          <option value="">-- Selecciona un plato --</option>
          <option value="pizza">🍕 Pizza</option>
          <option value="hamburguesa">🍔 Hamburguesa</option>
          <option value="ensalada">🥗 Ensalada</option>
          <option value="pasta">🍝 Pasta</option>
          <option value="sushi">🍣 Sushi</option>
        </select>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1" />

        <label for="direccion">Dirección de entrega:</label>
        <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. Heroínas #123" required />

        <button type="button" onclick="enviarPedido()">Realizar Pedido</button>
      </form>

      <div id="respuesta" class="respuesta"></div>
    </section>
  </main>

  <!-- FOOTER - Colaborador 2 -->
  <footer id="contacto">
    <div class="footer-content">
      <p>📍 Cochabamba, Bolivia</p>
      <p>📞 +591 4 000-0000</p>
      <p>✉️ contacto@foodorder.bo</p>
    </div>
    <div class="redes">
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="#">WhatsApp</a>
    </div>
    <p class="copy">© 2025 FoodOrder — Todos los derechos reservados</p>
  </footer>

  <script>
    function enviarPedido() {
      const nombre = document.getElementById('nombre').value;
      const comida = document.getElementById('comida').value;
      const cantidad = document.getElementById('cantidad').value;
      const direccion = document.getElementById('direccion').value;
      const respuesta = document.getElementById('respuesta');

      if (!nombre || !comida || !direccion) {
        respuesta.innerHTML = '⚠️ Por favor completa todos los campos.';
        respuesta.style.color = '#e74c3c';
        return;
      }

      respuesta.innerHTML = `✅ ¡Pedido recibido, <strong>${nombre}</strong>!<br>
        🍽️ <strong>${cantidad}x ${comida}</strong> en camino a <em>${direccion}</em>.<br>
        Tiempo estimado: 30-45 minutos.`;
      respuesta.style.color = '#27ae60';
    }
  </script>
